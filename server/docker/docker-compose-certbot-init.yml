services:
  # SSL 인증서 초기 발급용
  # 사용법: DOMAIN=your-domain.com CERTBOT_EMAIL=your@email.com docker compose -f docker-compose-certbot-init.yml up
  nginx-certbot-init:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./certbot-init.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
    networks:
      - insurance-network

  certbot:
    image: certbot/certbot
    depends_on:
      - nginx-certbot-init
    volumes:
      - certbot-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    command: >
      certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos --no-eff-email
      -d ${DOMAIN}

volumes:
  certbot-webroot:
  letsencrypt:

networks:
  insurance-network:
    driver: bridge
