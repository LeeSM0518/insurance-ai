spring:
  flyway:
    clean-disabled: false
    baseline-on-migrate: true
    baseline-version: "0"

  ai:
    anthropic:
      api-key: test-api-key
      chat:
        options:
          model: claude-sonnet-4-6
    openai:
      api-key: test-api-key
      embedding:
        options:
          model: text-embedding-3-large

app:
  jwt:
    access-token-secret: test-access-token-secret-key-for-testing-purposes-only-minimum-256-bits
    refresh-token-secret: test-refresh-token-secret-key-for-testing-purposes-only-minimum-256-bits
    access-token-expiration: 3600000
    refresh-token-expiration: 2592000000
  security:
    permit-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
    cors-allowed-origins:
      - http://localhost:5173

logging:
  level:
    root: WARN
    com.insuranceai: INFO
    org.springframework.r2dbc: WARN
    org.springframework.security: WARN
    org.testcontainers: INFO
    org.flywaydb: INFO
