spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}

logging:
  level:
    com.insuranceai: DEBUG
    org.springframework.r2dbc: DEBUG

app:
  security:
    permit-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
    cors-allowed-origins:
      - http://localhost:5173
