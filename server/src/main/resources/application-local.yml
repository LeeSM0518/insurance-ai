spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}

app:
  security:
    permit-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /swagger-ui/**
      - /v3/api-docs/**
      - /webjars/**
      - /api/v1/shared/**
    cors-allowed-origins:
      - http://localhost:5173

logging:
  level:
    root: info
    com.insuranceai: DEBUG
    org.springframework.security: debug
    org.springframework.r2dbc: debug
    org.springdoc: debug
    io.swagger: debug
    io.r2dbc.postgresql:
      QUERY: debug
      PARAM: debug
    org.springframework.ai.chat.client.advisor: debug