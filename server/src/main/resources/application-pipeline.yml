spring:
  main:
    web-application-type: none    # 웹 서버 비활성화 (CLI 모드)

app:
  pipeline:
    # type: LIFE          # LIFE | NON_LIFE (미지정 시 전체)
    # categories: []      # 빈 리스트면 전체 카테고리
    # incremental: false
    # dry-run: false
    # steps: []            # CRAWL,VALIDATE,PUBLISH,EMBED (빈 리스트면 전체)
    # batch-id:            # CRAWL 없이 실행 시 이전 batchId 지정
    crawl:
      delay-min-ms: 2000
      delay-max-ms: 5000
      max-retries: 3
      user-agent: InsuranceAI-Bot/1.0
      download-dir: data/summaries
      headless: true

logging:
  level:
    com.insuranceai.pipeline: DEBUG
