spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    openai:
      api-key: ${OPENAI_API_KEY}

app:
  security:
    permit-paths:
      - /api/v1/auth/**
      - /actuator/health
      - /api/v1/shared/**
    cors-allowed-origins:
      - ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.insuranceai: INFO
    org.springframework.r2dbc: WARN
    org.springframework.security: WARN
